server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression pour de meilleures performances de chargement
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache long pour les fichiers statiques versionnés par Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : toutes les routes React Router (/admin, /details/:id, ...)
    # doivent renvoyer index.html, sinon un F5 sur /admin donnerait un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
