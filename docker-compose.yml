services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changez_moi}
      POSTGRES_DB: ${DB_NAME:-logement_location_vente}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Miditra tsy misy fanadiovana ny base isaky ny "docker compose up" voalohany :
      # ny script SQL dia atao automatique tamin'ny fotoana famoronana ny volume ihany.
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changez_moi}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-logement_location_vente}
      JWT_SECRET: ${JWT_SECRET:-changez_moi_avec_une_valeur_longue_et_aleatoire}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:5000}
        VITE_FACEBOOK_URL: ${VITE_FACEBOOK_URL:-https://facebook.com/logementmad.fianarantsoa}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads_data:
